<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa do Ecossistema de Fomento</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--brand:#6366f1;--brand2:#8b5cf6;--accent:#14b8a6;--line:#e2e8f0;--soft:#f8fafc;--radius:16px;--shadow:0 10px 30px rgba(2,6,23,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(160deg,#eef2ff,#f0fdfa 60%);min-height:100vh;padding:28px 18px}
.wrap{max-width:1080px;margin:0 auto}
.head{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:var(--radius);padding:26px 30px;box-shadow:var(--shadow)}
.badge{display:inline-block;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.5px;margin-bottom:10px}
.head h1{font-size:26px;margin-bottom:6px}
.head p{opacity:.92;font-size:15px;max-width:760px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--muted);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
.card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-top:5px solid var(--brand);cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-4px)}
.card h3{font-size:18px;margin-bottom:4px}
.card .tag{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.card p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.pills{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;background:var(--soft);color:var(--muted);padding:3px 9px;border-radius:6px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.open{display:flex}
.box{background:#fff;border-radius:var(--radius);max-width:560px;width:100%;padding:28px;max-height:88vh;overflow:auto}
.box h2{font-size:22px;margin-bottom:6px}
.box .sub{color:var(--accent);font-weight:700;font-size:13px;margin-bottom:16px}
.box dl{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:14px}
.box dt{font-weight:700;color:var(--muted)}
.close{float:right;border:none;background:var(--soft);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="badge">AULA 1 · JORNADA PIPE</span>
    <h1>🗺️ Mapa do Ecossistema de Fomento à Inovação</h1>
    <p>Quem financia o quê no Brasil? Filtre por tipo de apoio e estágio do projeto, clique em cada agência e descubra onde a sua ideia se encaixa. Este é o seu ponto de partida.</p>
  </div>

  <div class="filters" id="ftipo"></div>
  <div class="filters" id="festagio"></div>
  <div class="grid" id="grid"></div>
  <div class="foot">Jornada PIPE FAPESP · Estratégias de Fomento à Inovação</div>
</div>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
const AG=[
 {n:"FAPESP — PIPE",tag:"Estadual (SP)",cor:"#6366f1",tipo:["Não reembolsável"],estagio:["Ideação","Viabilidade","Desenvolvimento"],
  desc:"Pesquisa Inovativa em Pequenas Empresas. Subvenção (grant) para P,D&I em empresas de SP. É o destino do nosso projeto final.",
  alvo:"Pequenas empresas (até 250 func.) com P&D no Estado de SP",foco:"Pesquisa de alto risco tecnológico com potencial de inovação",
  valor:"Fase 1: até R$300 mil / Fase 2: até R$1,5 mi",acesso:"Submissão contínua via SAGe"},
 {n:"Finep",tag:"Federal",cor:"#8b5cf6",tipo:["Não reembolsável","Reembolsável","Equity"],estagio:["Viabilidade","Desenvolvimento","Mercado"],
  desc:"Principal agência federal de fomento a CT&I (MCTI). Opera subvenção, crédito e equity (Finep Startup).",
  alvo:"Empresas de todos os portes e ICTs",foco:"Inovação com alto risco tecnológico; programas Centelha, Tecnova",
  valor:"Finep Startup: até R$2 mi (equity)",acesso:"Chamadas públicas e cartas-convite"},
 {n:"BNDES",tag:"Federal",cor:"#0ea5e9",tipo:["Reembolsável"],estagio:["Desenvolvimento","Mercado"],
  desc:"Banco de desenvolvimento. Crédito de longo prazo para inovação e digitalização (BNDES Mais Inovação).",
  alvo:"Empresas com projetos de investimento e escala",foco:"Implantação, expansão e digitalização",
  valor:"Linhas de crédito de longo prazo",acesso:"Operações diretas e indiretas (bancos credenciados)"},
 {n:"Embrapii",tag:"Org. Social",cor:"#14b8a6",tipo:["Compartilhamento de risco"],estagio:["Desenvolvimento"],
  desc:"Compartilha custos e riscos de projetos de PD&I entre empresa e ICT. Modelo híbrido com contrapartida.",
  alvo:"Empresas em parceria com unidades Embrapii",foco:"Pesquisa aplicada (TRL intermediário) empresa↔ICT",
  valor:"Até 1/3 não reembolsável + contrapartidas",acesso:"Unidades credenciadas Embrapii"},
 {n:"Sebrae",tag:"Privado (paraest.)",cor:"#f59e0b",tipo:["Serviços tecnológicos"],estagio:["Ideação","Viabilidade"],
  desc:"Apoio, capacitação e consultoria subsidiada para micro e pequenas empresas. ALI Inovação.",
  alvo:"Micro e pequenas empresas",foco:"Desenvolvimento de capacidades e gestão da inovação",
  valor:"Serviços subsidiados (não é repasse direto)",acesso:"Programas e editais Sebrae"},
 {n:"Desenvolve SP",tag:"Estadual (SP)",cor:"#ef4444",tipo:["Reembolsável"],estagio:["Desenvolvimento","Mercado"],
  desc:"Agência de fomento do Estado de SP. Crédito para investimento e capital de giro de pequenas e médias empresas.",
  alvo:"PMEs paulistas",foco:"Financiamento de projetos com retorno de mercado",
  valor:"Linhas de crédito estaduais",acesso:"Análise de crédito"}
];
const TIPOS=["Todos","Não reembolsável","Reembolsável","Equity","Compartilhamento de risco","Serviços tecnológicos"];
const ESTAGIOS=["Todos","Ideação","Viabilidade","Desenvolvimento","Mercado"];
let fT="Todos",fE="Todos";
function chips(id,arr,cur,set){document.getElementById(id).innerHTML=arr.map(x=>`<div class="chip ${x===cur?'active':''}" onclick="${set}('${x}')">${x}</div>`).join("")}
function setT(x){fT=x;render()} function setE(x){fE=x;render()}
function render(){
 chips("ftipo",TIPOS,fT,"setT");chips("festagio",ESTAGIOS,fE,"setE");
 const list=AG.filter(a=>(fT==="Todos"||a.tipo.includes(fT))&&(fE==="Todos"||a.estagio.includes(fE)));
 document.getElementById("grid").innerHTML=list.map((a)=>`<div class="card" style="border-color:${a.cor}" onclick="open_(${AG.indexOf(a)})">
   <span class="tag">${a.tag}</span><h3>${a.n}</h3><p>${a.desc}</p>
   <div class="pills">${a.tipo.map(t=>`<span class="pill">${t}</span>`).join("")}</div></div>`).join("")
   || `<p style="color:var(--muted)">Nenhuma agência com esse filtro. Combine outros critérios.</p>`;
}
function open_(i){const a=AG[i];document.getElementById("box").innerHTML=`<button class="close" onclick="document.getElementById('modal').classList.remove('open')">×</button>
 <h2>${a.n}</h2><div class="sub">${a.tag}</div>
 <dl><dt>Tipo de apoio</dt><dd>${a.tipo.join(", ")}</dd>
 <dt>Público-alvo</dt><dd>${a.alvo}</dd><dt>Foco</dt><dd>${a.foco}</dd>
 <dt>Valores</dt><dd>${a.valor}</dd><dt>Como acessar</dt><dd>${a.acesso}</dd>
 <dt>Estágio</dt><dd>${a.estagio.join(" · ")}</dd></dl>`;
 document.getElementById("modal").classList.add("open");}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("open")};
render();
</script>
</body>
</html>
